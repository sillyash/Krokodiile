[project]
name = "fiirefly-api"
version = "0.2.0"
description = "API pour FiiReFLY avec Django REST Framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "authlib>=1.9.5",
    "django>=5.2.18",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.3",
    "gunicorn>=27.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
extend-exclude = ["**/migrations"]

[tool.ruff.format]
# Matches the quotes Django's startproject templates generate.
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
